# Tests and lints every pull request and every push to main on the three systems the app runs on.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos, os: macos-latest }
          - { name: linux, os: ubuntu-24.04 }
          - { name: windows, os: windows-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Software renderer for the off-screen window tests
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --workspace
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
