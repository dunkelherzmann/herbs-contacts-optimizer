[package]
name = "herbs-contacts-optimizer"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
hco-core = { version = "0.1.0", path = "../core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18.0"

# Linux: the session bus, to ask Evolution Data Server for the computer's own address books.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Windows: the system's contact store, for the computer's own address books.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel_Contacts", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
hco-core = { path = "../core", features = ["mock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.2"
